<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>얼음과 불의 춤</title>
  <style>
    html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000; }
    canvas { display:block;width:100%;height:100%;outline:0; }
    #loading { position:fixed;inset:0;display:grid;place-content:center;gap:14px;background:#10121a;color:#fff;font:18px sans-serif;text-align:center; }
    progress { width:280px; }
    #error { max-width:80vw;white-space:pre-wrap; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="얼음과 불의 춤 게임 화면"></canvas>
  <div id="loading" role="status"><span>얼음과 불의 춤 불러오는 중</span><progress max="1" value="0"></progress><span id="error"></span></div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.getElementById('game');
    createUnityInstance(canvas, {
      dataUrl:'Build/WebGL.data',
      frameworkUrl:'Build/WebGL.framework.js',
      codeUrl:'Build/WebGL.wasm',
      streamingAssetsUrl:'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "ExportedProject",
      productVersion: "1.0",
      autoSyncPersistentDataPath:true,
      showBanner:(message, type) => { if (type === 'error') console.error(message); else console.warn(message); }
    }, progress => { document.querySelector('progress').value = progress; })
    .then(instance => { window.unityInstance = instance; document.getElementById('loading').remove(); canvas.focus(); })
    .catch(error => { document.getElementById('error').textContent = '게임을 불러오지 못했습니다.\n' + String(error); });
    window.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
