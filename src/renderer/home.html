<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>EMG 게임</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="app">
  <header>
    <h1>근육으로 게임하기</h1>
    <div id="status" class="pill"><i class="dot"></i><span id="status-text">장치 없음</span></div>
  </header>

  <main>
    <section class="game g-gd" data-id="gd">
      <div class="art">
        <img class="cover" src="images/gd-card.webp" alt="">
      </div>
      <div class="body">
        <h2>Geometry Dash</h2>
        <div class="row"><label>누를 키</label><button class="keychip"></button></div>
        <button class="start">시작</button>
      </div>
    </section>

    <section class="game g-flappy" data-id="flappy">
      <div class="art fb-art">
        <div class="fb-sky"></div>
        <div class="fb-pipe fb-top"><i></i></div>
        <div class="fb-pipe fb-bottom"><i></i></div>
        <div class="fb-bird"></div>
        <div class="fb-land"></div>
      </div>
      <div class="body">
        <h2>Flappy Bird</h2>
        <div class="row"><label>누를 키</label><button class="keychip"></button></div>
        <button class="start">시작</button>
      </div>
    </section>

    <section class="game g-adofai" data-id="adofai">
      <div class="art">
        <img class="cover" src="images/adofai-card.png" alt="">
        <button class="tag prelaunch" hidden>미리 켜기</button>
        <span class="tag state" hidden></span>
      </div>
      <div class="body">
        <h2>얼음과 불의 춤</h2>
        <div class="row"><label>누를 키</label><button class="keychip"></button></div>
        <button class="start">시작</button>
      </div>
    </section>
  </main>

  <section class="force">
    <div class="f-label">지금 힘</div>
    <div class="meter"><div id="fill" class="fill"></div><div id="tick" class="tick"></div></div>
    <div id="force" class="f-num">--</div>
  </section>
  <div class="esc">게임 중 나가기 <b>Esc</b> · 얼음과 불의 춤 <b>Ctrl+Q</b></div>
  <footer id="version" class="version"></footer>
</div>
<script src="home.js"></script>
</body>
</html>
