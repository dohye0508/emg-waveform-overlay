<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>EMG Overlay</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="card" class="card">
  <div class="head">
    <i id="dot" class="dot"></i>
    <span class="title">근전도</span>
    <span id="chip" class="chip">SPACE</span>
    <span id="rms" class="rms">--</span>
  </div>
  <div class="wave"><canvas id="wave"></canvas></div>
  <div class="bar"><div id="fill" class="fill"></div><div id="rel" class="tick rel"></div><div class="tick"></div></div>
  <div id="drag" class="drag" hidden>끌어서 옮기기</div>
</div>
<script src="wave.js"></script>
<script src="overlay.js"></script>
</body>
</html>
